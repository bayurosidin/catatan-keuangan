<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catatan Keuangan Harian</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2033;--mut:#7a8199;--in:#16a34a;--out:#e11d48;--ac:#6366f1;--bd:#e5e8f2;--sh:0 8px 30px rgba(40,50,100,.08);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1120;--card:#171b30;--tx:#eef0fa;--mut:#8b92b0;--bd:#262b45;--sh:0 8px 30px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0e1120;--card:#171b30;--tx:#eef0fa;--mut:#8b92b0;--bd:#262b45;--sh:0 8px 30px rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:background .3s,color .3s}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;animation:down .6s both}
h1{font-size:1.3rem;margin:0}h1 small{display:block;font-size:.8rem;color:var(--mut);font-weight:400}
.sync{font-size:.74rem;color:var(--mut);border:1px solid var(--bd);background:var(--card);padding:6px 10px;border-radius:99px;transition:color .3s,transform .3s}
.sync[data-s=ok]{color:var(--in)}.sync[data-s=busy]{color:var(--ac);animation:pulse 1s infinite}
.hr{display:flex;gap:8px;align-items:center}
.tbtn{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:8px 12px;cursor:pointer;font-size:1rem}
.hero{background:linear-gradient(135deg,#6366f1,#8b5cf6 55%,#ec4899);background-size:200% 200%;animation:grad 8s ease infinite,up .7s both;color:#fff;border-radius:22px;padding:24px;box-shadow:0 14px 40px rgba(99,102,241,.35)}
.hero p{margin:0;opacity:.85;font-size:.9rem}
.hero .bal{font-size:2.2rem;font-weight:800;margin:6px 0 18px;letter-spacing:-.5px}
.row{display:flex;gap:12px}
.mini{flex:1;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);border-radius:14px;padding:12px}
.mini b{display:block;font-size:1.05rem;margin-top:2px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:18px;margin-top:16px;box-shadow:var(--sh);animation:up .7s both}
.card h2{font-size:1rem;margin:0 0 12px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:12px;position:relative}
.seg button{border:0;background:none;color:var(--mut);padding:10px;border-radius:9px;font-weight:600;cursor:pointer;position:relative;z-index:1;transition:color .25s}
.seg button.on{color:#fff}
.pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:9px;background:var(--in);transition:transform .3s cubic-bezier(.4,1.4,.5,1),background .3s}
.seg.out .pill{transform:translateX(100%);background:var(--out)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:.95rem;font-family:inherit;outline:none;transition:border .2s,box-shadow .2s}
input:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(99,102,241,.2)}
.full{grid-column:1/-1}
.add{width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-weight:700;font-size:1rem;cursor:pointer;transition:transform .15s,filter .2s}
.add:hover{filter:brightness(1.1)}.add:active{transform:scale(.97)}
.filters{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.chip{border:1px solid var(--bd);background:none;color:var(--mut);padding:6px 14px;border-radius:99px;cursor:pointer;font-size:.85rem;transition:.2s}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--bd);animation:slide .45s both;overflow:hidden}
.item:last-child{border:0}
.item.rm{animation:gone .35s forwards}
.ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:1.2rem;background:var(--bg)}
.inf{flex:1;min-width:0}.inf b{display:block;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inf span{font-size:.78rem;color:var(--mut)}
.amt{font-weight:700;font-size:.95rem;white-space:nowrap}.amt.in{color:var(--in)}.amt.out{color:var(--out)}
.del{border:0;background:none;color:var(--mut);cursor:pointer;font-size:1rem;padding:6px;border-radius:8px;transition:.2s}
.del:hover{color:var(--out);transform:scale(1.2)}
.bar{margin:10px 0}.bar .t{display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:5px}
.bar .tr{height:9px;background:var(--bg);border-radius:9px;overflow:hidden}
.bar .fl{height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#f43f5e,#fb923c);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.empty{text-align:center;color:var(--mut);padding:26px 0;animation:up .6s both}
.empty div{font-size:2.4rem;animation:float 3s ease-in-out infinite}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,120px);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:.88rem;transition:transform .4s cubic-bezier(.3,1.5,.5,1);z-index:9}
.toast.show{transform:translate(-50%,0)}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes down{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
@keyframes slide{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes gone{to{opacity:0;transform:translateX(60px);max-height:0;padding:0}}
@keyframes grad{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes pulse{50%{transform:scale(1.04)}}
.pop{animation:pulse .4s}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>💰 Catatan Keuangan<small id="today"></small></h1>
    <div class="hr"><span class="sync" id="sync">💾 Di perangkat</span><button class="tbtn" id="theme" title="Ganti tema">🌓</button></div>
  </header>

  <section class="hero">
    <p>Saldo Saat Ini</p>
    <div class="bal" id="bal">Rp 0</div>
    <div class="row">
      <div class="mini">⬇️ Uang Masuk<b id="tin">Rp 0</b></div>
      <div class="mini">⬆️ Uang Keluar<b id="tout">Rp 0</b></div>
    </div>
  </section>

  <section class="card" style="animation-delay:.15s">
    <h2>Tambah Catatan</h2>
    <div class="seg" id="seg"><div class="pill"></div>
      <button class="on" data-t="in">Uang Masuk</button>
      <button data-t="out">Uang Keluar</button>
    </div>
    <div class="grid">
      <input class="full" id="amount" type="text" inputmode="numeric" placeholder="Jumlah (Rp)">
      <select id="cat"></select>
      <input id="date" type="date">
      <input class="full" id="note" type="text" placeholder="Catatan (opsional), mis. makan siang" maxlength="60">
    </div>
    <button class="add" id="addBtn">+ Simpan Catatan</button>
  </section>

  <section class="card" style="animation-delay:.3s">
    <h2>Pengeluaran per Kategori</h2>
    <div id="bars"></div>
  </section>

  <section class="card" style="animation-delay:.45s">
    <h2>Riwayat Transaksi</h2>
    <div class="filters" id="filters">
      <button class="chip on" data-f="all">Semua</button>
      <button class="chip" data-f="in">Masuk</button>
      <button class="chip" data-f="out">Keluar</button>
    </div>
    <div id="list"></div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
const CATS={in:[["💼","Gaji"],["🛒","Hasil Jualan"],["🎁","Hadiah"],["💵","Uang Saku"],["✨","Lainnya"]],
out:[["🍜","Makanan"],["🚌","Transportasi"],["🛍️","Belanja"],["📱","Pulsa & Internet"],["🎮","Hiburan"],["📚","Pendidikan"],["✨","Lainnya"]]};
let tx=[],type="in",filter="all",shown={bal:0,tin:0,tout:0};
const $=id=>document.getElementById(id);
const rp=n=>"Rp "+Math.round(n).toLocaleString("id-ID");
const esc=s=>s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
try{tx=JSON.parse(localStorage.getItem("keuangan_tx")||"[]")}catch(e){tx=[]}
let ref=null,timer=null,busy=false,dirty=false,pending=false;
function setSync(s,t){const e=$("sync");e.textContent=t;e.dataset.s=s}
function local(){try{localStorage.setItem("keuangan_tx",JSON.stringify(tx))}catch(e){}}
function save(){local();if(!ref)return;pending=true;setSync("busy","⏳ Menyimpan...");clearTimeout(timer);timer=setTimeout(push,300)}
async function push(){
 if(busy){dirty=true;return}
 busy=true;
 try{await ref.set({tx:tx,updated:Date.now()});setSync("ok","☁️ Tersimpan otomatis")}
 catch(e){setSync("err","⚠️ Gagal sinkron, tersimpan di perangkat")}
 busy=false;
 if(dirty){dirty=false;push()}else pending=false}
try{const t=localStorage.getItem("keuangan_theme");if(t)document.documentElement.dataset.theme=t}catch(e){}

$("theme").onclick=()=>{const d=document.documentElement,dark=getComputedStyle(d).getPropertyValue("--bg").trim()==="#0e1120";
 d.dataset.theme=dark?"light":"dark";try{localStorage.setItem("keuangan_theme",d.dataset.theme)}catch(e){}};
$("today").textContent=new Date().toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
$("date").valueAsDate=new Date();

function fillCats(){$("cat").innerHTML=CATS[type].map(c=>`<option value="${c[1]}">${c[0]} ${c[1]}</option>`).join("")}
fillCats();
$("seg").onclick=e=>{const b=e.target.closest("button");if(!b)return;type=b.dataset.t;
 $("seg").classList.toggle("out",type==="out");
 [...$("seg").querySelectorAll("button")].forEach(x=>x.classList.toggle("on",x===b));fillCats()};
$("amount").oninput=e=>{const v=e.target.value.replace(/\D/g,"");e.target.value=v?Number(v).toLocaleString("id-ID"):""};
$("filters").onclick=e=>{const b=e.target.closest("button");if(!b)return;filter=b.dataset.f;
 [...$("filters").children].forEach(x=>x.classList.toggle("on",x===b));renderList()};

function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("show"),2000)}
function count(id,to){const el=$(id),from=shown[id],t0=performance.now();
 (function f(t){const p=Math.min((t-t0)/800,1),e=1-Math.pow(1-p,3);el.textContent=rp(from+(to-from)*e);
  if(p<1)requestAnimationFrame(f);else shown[id]=to})(t0)}

$("addBtn").onclick=()=>{
 const a=Number($("amount").value.replace(/\D/g,""));
 if(!a){toast("⚠️ Isi jumlah dulu ya");$("amount").focus();return}
 const c=CATS[type].find(x=>x[1]===$("cat").value);
 tx.unshift({id:Date.now(),type,amount:a,cat:c[1],icon:c[0],note:$("note").value.trim(),date:$("date").value||new Date().toISOString().slice(0,10)});
 save();$("amount").value="";$("note").value="";
 $("bal").classList.remove("pop");void $("bal").offsetWidth;$("bal").classList.add("pop");
 toast(type==="in"?"✅ Uang masuk dicatat":"✅ Uang keluar dicatat");render(tx[0].id)};

function renderList(newId){
 const l=tx.filter(t=>filter==="all"||t.type===filter);
 $("list").innerHTML=l.length?l.map((t,i)=>`<div class="item" data-id="${t.id}" style="animation-delay:${newId?0:Math.min(i*.05,.5)}s">
 <div class="ic">${t.icon}</div><div class="inf"><b>${esc(t.note||t.cat)}</b><span>${t.cat} • ${new Date(t.date+"T00:00").toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"})}</span></div>
 <div class="amt ${t.type}">${t.type==="in"?"+":"−"}${rp(t.amount)}</div><button class="del" title="Hapus">✕</button></div>`).join("")
 :`<div class="empty"><div>🪙</div>Belum ada catatan.<br>Yuk mulai catat keuanganmu!</div>`}
$("list").onclick=e=>{if(!e.target.classList.contains("del"))return;
 const it=e.target.closest(".item"),id=+it.dataset.id;it.classList.add("rm");
 setTimeout(()=>{tx=tx.filter(t=>t.id!==id);save();render();toast("🗑️ Catatan dihapus")},330)};

function renderBars(){
 const ex=tx.filter(t=>t.type==="out"),tot=ex.reduce((s,t)=>s+t.amount,0),m={};
 ex.forEach(t=>m[t.cat]=(m[t.cat]||0)+t.amount);
 const arr=Object.entries(m).sort((a,b)=>b[1]-a[1]);
 $("bars").innerHTML=arr.length?arr.map(([k,v])=>`<div class="bar"><div class="t"><span>${k}</span><span>${rp(v)} (${Math.round(v/tot*100)}%)</span></div><div class="tr"><div class="fl" data-w="${v/tot*100}"></div></div></div>`).join("")
 :`<div class="empty" style="padding:8px 0">Belum ada pengeluaran</div>`;
 requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll(".fl").forEach(f=>f.style.width=f.dataset.w+"%")))}

function render(newId){
 const i=tx.filter(t=>t.type==="in").reduce((s,t)=>s+t.amount,0),o=tx.filter(t=>t.type==="out").reduce((s,t)=>s+t.amount,0);
 count("bal",i-o);count("tin",i);count("tout",o);renderList(newId);renderBars()}
render();
(async()=>{
 try{
  if(!window.claude||!claude.use)return;
  const [user,d]=await Promise.all([claude.use("user"),claude.use("db")]);
  if(!user||!d)return;
  const id=await user.id();
  if(!id)return;
  ref=d.doc("data/users/"+id+"/finance");
  let first=true;
  ref.onSnapshot(snap=>{
   const remote=snap.exists&&Array.isArray(snap.data().tx)?snap.data().tx:[];
   if(first){
    first=false;
    const ids=new Set(remote.map(t=>t.id));
    const merged=remote.concat(tx.filter(t=>!ids.has(t.id))).sort((a,b)=>b.id-a.id);
    const changed=JSON.stringify(merged)!==JSON.stringify(remote);
    tx=merged;local();render();
    if(changed){pending=true;push()}else setSync("ok","☁️ Tersimpan otomatis");
   }else if(!pending&&!snap.metadata.hasPendingWrites&&JSON.stringify(remote)!==JSON.stringify(tx)){
    tx=remote;local();render();
   }
  },()=>setSync("err","💾 Tersimpan di perangkat"));
 }catch(e){}
})();
</script>
</body>
</html>
